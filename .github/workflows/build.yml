name: Build CenterSpeed

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore CenterSpeed/CenterSpeed.csproj

      - name: Build
        run: dotnet build CenterSpeed/CenterSpeed.csproj -c Release --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CenterSpeed-build
          path: |
            CenterSpeed/bin/Release/net10.0/CenterSpeed.dll
            CenterSpeed/bin/Release/net10.0/CenterSpeed.deps.json
            CenterSpeed/bin/Release/net10.0/CenterSpeed.runtimeconfig.json
            Timer.Shared/bin/Release/net10.0/Timer.Shared.dll
            Timer.Shared/bin/Release/net10.0/Timer.Shared.deps.json
            Timer.Shared/bin/Release/net10.0/Timer.Shared.runtimeconfig.json
          if-no-files-found: error
