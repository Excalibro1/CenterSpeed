name: build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CenterSpeed/CenterSpeed.csproj

      - name: Build
        run: dotnet build CenterSpeed/CenterSpeed.csproj -c Release --no-restore

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: CenterSpeed-release
          path: |
            CenterSpeed/bin/Release/net10.0/
          if-no-files-found: error
